<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Shobdo Setu - Live Sign Language Translator</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="wrapper">
        <div class="box">
            <div class="header-container">
                <img src="/static/logo.png" alt="Shobdo Setu Logo" class="project-logo">
                <h1>Shobdo Setu</h1>
            </div>

            <div class="links">
                <a href="/">Translator</a> |
                <a href="/submit">Submit Sign</a> |
                <a href="/moderator">Moderator Panel</a>
            </div>
        </div>

        <div class="box">
            <video id="webcam" playsinline></video>
            <canvas id="output_canvas"></canvas>
            <h2>Detected Sign: <span id="wordBox" style="color:#007bff;">Loading...</span></h2>
            <p style="font-size: 14px; color: #555;">Match Latency: <span id="perfBox">0.00</span> ms | Loaded Signs:
                <span id="countBox">0</span>
            </p>
            <h3>Sentence: <span id="sentenceBox">Start signing...</span></h3>
            <button class="btn-green" onclick="speakText()">Speak</button>
            <button class="btn-orange" onclick="undoText()">Undo</button>
            <button class="btn-red" onclick="clearText()">Clear</button>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>

</html>
