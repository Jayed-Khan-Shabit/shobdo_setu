<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Moderator Login - Shobdo Setu</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="wrapper">
        <div class="box" style="max-width: 400px; margin: 80px auto;">
            <div class="header-container">
                <img src="/static/logo.png" alt="Shobdo Setu Logo" class="project-logo">
                <h2>Admin Authentication</h2>
            </div>
            <p>Enter moderator password to continue</p>
            {% if error %}
            <p style="color: #dc3545; font-weight: bold;">{{ error }}</p>
            {% endif %}
            <form method="POST" action="/moderator-login">
                <input type="password" name="password" placeholder="Admin Password" required
                    style="width: 85%; margin-bottom: 12px;">
                <br>
                <button type="submit" class="btn-blue" style="width: 90%;">Login</button>
            </form>
            <div class="links">
                <a href="/">← Back to Translator</a>
            </div>
        </div>
    </div>
</body>

</html>
