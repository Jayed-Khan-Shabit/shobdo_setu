<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Submit Sign - Shobdo Setu</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="wrapper">
        <div class="box">
            <div class="header-container">
                <img src="/static/logo.png" alt="Shobdo Setu Logo" class="project-logo">
                <h1>Contribute a Sign</h1>
            </div>
            <div class="links">
                <a href="/">← Back to Translator</a> |
                <a href="/moderator">Moderator Panel</a>
            </div>
        </div>

        <div class="box">
            <video id="webcam" playsinline></video>
            <canvas id="output_canvas"></canvas>
            <p id="statusText" style="font-weight:bold; color:#007bff;">Show hand to camera</p>
            <button id="freezeBtn" class="btn-orange" onclick="toggleFreeze()">Freeze Sign</button>
            <br><br>
            <input type="text" id="signName" placeholder="Enter word (e.g. Hello)">
            <button class="btn-green" onclick="submitGesture()">Submit Sign</button>
        </div>
    </div>
    <script src="/static/submit.js"></script>
</body>

</html>
